<style>
  :root { --ana:#f27a1a; --koyu:#333; --gri:#777; --zemin:#f5f5f5; }
  * { box-sizing:border-box; }
  body { margin:0; font-family:-apple-system,Segoe UI,Roboto,Arial,sans-serif; background:var(--zemin); color:var(--koyu); }
  header { background:#fff; padding:18px 16px; text-align:center; border-bottom:3px solid var(--ana); }
  header h1 { margin:0; font-size:20px; }
  header p { margin:6px 0 0; color:var(--gri); font-size:14px; }
  main { max-width:640px; margin:0 auto; padding:14px; }
  .kart { display:flex; gap:14px; background:#fff; border-radius:12px; padding:12px; margin-bottom:12px; box-shadow:0 1px 4px rgba(0,0,0,.08); }
  .kart img { width:96px; height:128px; object-fit:contain; border-radius:8px; background:#fafafa; flex-shrink:0; }
  .bilgi { flex:1; display:flex; flex-direction:column; min-width:0; }
  .ad { font-weight:600; font-size:15px; line-height:1.3; }
  .adet { margin-top:6px; font-size:14px; }
  .adet b { color:var(--ana); }
  .not { margin-top:6px; font-size:14px; background:#fff6ee; border-left:3px solid var(--ana); padding:6px 8px; border-radius:4px; white-space:pre-wrap; }
  .btn { margin-top:auto; display:block; text-align:center; background:var(--ana); color:#fff; text-decoration:none; padding:10px; border-radius:8px; font-weight:600; font-size:14px; }
  .btn:active { opacity:.8; }
  .bos { text-align:center; color:var(--gri); padding:40px 10px; }
  footer { text-align:center; color:var(--gri); font-size:12px; padding:10px 0 24px; }
</style>
</head>
<body>
<header>
  <h1 id="baslik">Size Özel Takviye Listesi</h1>
  <p id="altBaslik">Ürünleri Trendyol'dan güvenle satın alabilirsiniz.</p>
</header>
<main id="liste"><div class="bos">Yükleniyor...</div></main>
<footer>Her ürünün altındaki butona basarak Trendyol'daki ürün sayfasına gidebilirsiniz.</footer>

<script>
//--- Ortak: Firebase (Firestore REST) ayarlari ve kayit/okuma fonksiyonlari ---15/11/2026---01:10
// Firestore REST API kullanılıyor (SDK yüklemeye gerek yok).
// Erişim izinleri Firestore Rules ile kontrol ediliyor: sadece yeni kayıt + kodla okuma.

const FIREBASE = {
  apiKey: "AIzaSyBYdSCDkH_hQ2qP6otzTY3vql8AB-N48FQ",
  projectId: "takviyelistem"
};

const FS_TABAN = `https://firestore.googleapis.com/v1/projects/${FIREBASE.projectId}/databases/(default)/documents/listeler`;

// Karışabilecek karakterler (0/O, 1/l/I) çıkarıldı — Rules'taki ^[A-Za-z0-9]{6}$ ile uyumlu
const KOD_HARFLER = "ABCDEFGHJKLMNPQRSTUVWXYZabcdefghijkmnpqrstuvwxyz23456789";

function kodUret() {
  const r = new Uint32Array(6);
  crypto.getRandomValues(r);
  let kod = "";
  for (let i = 0; i < 6; i++) kod += KOD_HARFLER[r[i] % KOD_HARFLER.length];
  return kod;
}

// liste: [{ id, adet, not }], kisi: string  ->  kod (string)
async function listeKaydet(liste, kisi) {
  const govde = {
    fields: {
      u: { arrayValue: { values: liste.map(x => ({
        mapValue: { fields: {
          i: { stringValue: String(x.id) },
          a: { integerValue: String(x.adet) },
          n: { stringValue: String(x.not || "") }
        } }
      })) } },
      k: { stringValue: String(kisi || "") },
      t: { timestampValue: new Date().toISOString() }
    }
  };

  // Aynı kod zaten varsa (çok düşük ihtimal) kural reddeder -> yeni kodla tekrar dene
  for (let deneme = 0; deneme < 5; deneme++) {
    const kod = kodUret();
    const yanit = await fetch(`${FS_TABAN}?documentId=${kod}&key=${FIREBASE.apiKey}`, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(govde)
    });
    if (yanit.ok) return kod;
    if (yanit.status !== 409 && yanit.status !== 403) {
      throw new Error("Kayıt hatası: HTTP " + yanit.status);
    }
  }
  throw new Error("Kayıt yapılamadı (Firestore izin/kural reddi)");
}

// kod -> { liste: [{ id, adet, not }], kisi } | null (bulunamadı)
async function listeOku(kod) {
  if (!/^[A-Za-z0-9]{6}$/.test(kod)) return null;
  const yanit = await fetch(`${FS_TABAN}/${kod}?key=${FIREBASE.apiKey}`);
  if (yanit.status === 404 || yanit.status === 403) return null;
  if (!yanit.ok) throw new Error("Okuma hatası: HTTP " + yanit.status);
  const v = await yanit.json();
  const f = v.fields || {};
  const liste = ((f.u && f.u.arrayValue && f.u.arrayValue.values) || []).map(e => {
    const m = (e.mapValue && e.mapValue.fields) || {};
    return {
      id: m.i ? m.i.stringValue : "",
      adet: m.a ? parseInt(m.a.integerValue, 10) || 1 : 1,
      not: m.n ? m.n.stringValue : ""
    };
  });
  return { liste, kisi: f.k ? f.k.stringValue : "" };
}
</script>
<script>
// Link formatları:
//   Yeni (kısa):  ?l=KOD            -> Firestore'dan okunur
//   Eski (uzun):  ?u=ID~ADET,...&n<ID>=NOT&k=KISI  -> geriye dönük uyumluluk
function esc(s) {
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function uzunLinkiCoz(p) {
  const u = (p.get('u') || '').trim();
  const liste = u.split(',').filter(Boolean).map(parca => {
    const [id, adetStr] = parca.split('~');
    return { id, adet: parseInt(adetStr, 10) || 1, not: (p.get('n' + id) || '').trim() };
  });
  return { liste, kisi: (p.get('k') || '').trim() };
}

async function baslat() {
  const alan = document.getElementById('liste');
  const p = new URLSearchParams(location.search);
  const kod = (p.get('l') || '').trim();

  let secim;
  try {
    if (kod) {
      secim = await listeOku(kod);
      if (!secim) {
        alan.innerHTML = '<div class="bos">Bu liste bulunamadı. Linki kontrol edin.</div>';
        return;
      }
    } else if (p.get('u')) {
      secim = uzunLinkiCoz(p);
    } else {
      alan.innerHTML = '<div class="bos">Bu linkte seçili ürün bulunamadı.</div>';
      return;
    }
  } catch (e) {
    alan.innerHTML = '<div class="bos">Liste yüklenemedi. İnternet bağlantınızı kontrol edip sayfayı yenileyin.</div>';
    return;
  }

  if (secim.kisi) {
    document.getElementById('baslik').textContent = secim.kisi + ' için Takviye Listesi';
    document.title = secim.kisi + ' için Takviye Listesi';
  }

  let veri;
  try {
    veri = await fetch('urunler.json', { cache: 'no-cache' }).then(r => r.json());
  } catch (e) {
    alan.innerHTML = '<div class="bos">Ürün listesi yüklenemedi. Lütfen sayfayı yenileyin.</div>';
    return;
  }

  const harita = {};
  veri.urunler.forEach(x => harita[x.id] = x);

  let html = '';
  secim.liste.forEach(s => {
    const urun = harita[s.id];
    if (!urun) return;
    const adet = Math.max(1, s.adet || 1);
    const not = (s.not || '').trim();
    html += `
      <div class="kart">
        <img src="${esc(urun.gorsel)}" alt="${esc(urun.ad)}" loading="lazy">
        <div class="bilgi">
          <div class="ad">${esc(urun.ad)}</div>
          <div class="adet">Adet: <b>${adet}</b></div>
          ${not ? `<div class="not">${esc(not)}</div>` : ''}
          <a class="btn" href="${esc(urun.link)}" target="_blank" rel="noopener">Trendyol'da Satın Al</a>
        </div>
      </div>`;
  });

  alan.innerHTML = html || '<div class="bos">Bu linkteki ürünler artık listede bulunmuyor.</div>';
}
baslat();
</script>
</body>
</html>
