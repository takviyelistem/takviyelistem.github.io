<!DOCTYPE html>

  :root { --ana:#f27a1a; --koyu:#333; --gri:#777; --zemin:#f5f5f5; --cizgi:#e3e3e3; }

  .alt .sayi { flex:1; font-size:14px; }
  .btn { border:0; border-radius:8px; padding:11px 14px; font-size:15px; font-weight:600; cursor:pointer; }

  .panel .butonlar { display:grid; grid-template-columns:1fr 1fr; gap:8px; margin-top:10px; }

<script>
//--- Ortak: Firebase (Firestore REST) kayit/okuma + acilma (o) ve urun tiklama (c) sayaclari ---15/11/2026---10:45
// Firestore REST API kullanılıyor (SDK yüklemeye gerek yok).
// Erişim izinleri Firestore Rules ile kontrol ediliyor: sadece yeni kayıt + kodla okuma.

const FIREBASE = {
  apiKey: "AIzaSyBYdSCDkH_hQ2qP6otzTY3vql8AB-N48FQ",
  projectId: "takviyelistem"
};

const FS_TABAN = `https://firestore.googleapis.com/v1/projects/${FIREBASE.projectId}/databases/(default)/documents/listeler`;

// Karışabilecek karakterler (0/O, 1/l/I) çıkarıldı — Rules'taki ^[A-Za-z0-9]{6}$ ile uyumlu
const KOD_HARFLER = "ABCDEFGHJKLMNPQRSTUVWXYZabcdefghijkmnpqrstuvwxyz23456789";

function kodUret() {
  const r = new Uint32Array(6);
  crypto.getRandomValues(r);
  let kod = "";
  for (let i = 0; i < 6; i++) kod += KOD_HARFLER[r[i] % KOD_HARFLER.length];
  return kod;
}

// liste: [{ id, adet, gunde, zaman:["Aç","Sabah",...], not }], kisi, hazirlayan: string,
// token: giriş yapan kullanıcının Firebase kimlik jetonu  ->  kod (string)
async function listeKaydet(liste, kisi, hazirlayan, token) {
  const govde = {
    fields: {
      u: { arrayValue: { values: liste.map(x => ({
        mapValue: { fields: {
          i: { stringValue: String(x.id) },
          a: { integerValue: String(x.adet) },
          g: { integerValue: String(x.gunde || 1) },
          z: { stringValue: (x.zaman || []).join(",") },
          n: { stringValue: String(x.not || "") }
        } }
      })) } },
      k: { stringValue: String(kisi || "") },
      h: { stringValue: String(hazirlayan || "") },
      o: { integerValue: "0" },
      t: { timestampValue: new Date().toISOString() }
    }
  };

  const basliklar = { "Content-Type": "application/json" };
  if (token) basliklar["Authorization"] = "Bearer " + token;

  // Aynı kod zaten varsa (çok düşük ihtimal) 409 döner -> yeni kodla tekrar dene
  for (let deneme = 0; deneme < 5; deneme++) {
    const kod = kodUret();
    const yanit = await fetch(`${FS_TABAN}?documentId=${kod}&key=${FIREBASE.apiKey}`, {
      method: "POST",
      headers: basliklar,
      body: JSON.stringify(govde)
    });
    if (yanit.ok) return kod;
    if (yanit.status === 409) continue;
    if (yanit.status === 403 || yanit.status === 401) {
      throw new Error("Yetki reddedildi. Çıkış yapıp tekrar giriş yapın.");
    }
    throw new Error("Kayıt hatası: HTTP " + yanit.status);
  }
  throw new Error("Kayıt yapılamadı (kod üretilemedi)");
}

// kod -> { liste: [{ id, adet, not }], kisi } | null (bulunamadı)
async function listeOku(kod) {
  if (!/^[A-Za-z0-9]{6}$/.test(kod)) return null;
  const yanit = await fetch(`${FS_TABAN}/${kod}?key=${FIREBASE.apiKey}`);
  if (yanit.status === 404 || yanit.status === 403) return null;
  if (!yanit.ok) throw new Error("Okuma hatası: HTTP " + yanit.status);
  const v = await yanit.json();
  const f = v.fields || {};
  const liste = ((f.u && f.u.arrayValue && f.u.arrayValue.values) || []).map(e => {
    const m = (e.mapValue && e.mapValue.fields) || {};
    return {
      id: m.i ? m.i.stringValue : "",
      adet: m.a ? parseInt(m.a.integerValue, 10) || 1 : 1,
      gunde: m.g ? parseInt(m.g.integerValue, 10) || 0 : 0,
      zaman: m.z && m.z.stringValue ? m.z.stringValue.split(",") : [],
      not: m.n ? m.n.stringValue : ""
    };
  });
  return { liste, kisi: f.k ? f.k.stringValue : "" };
}

// Sayaç artırma (Firestore commit + increment). Rules sadece tek alanın +1 artmasına izin verir.
async function sayacArtir(kod, alanYolu) {
  const belge = `projects/${FIREBASE.projectId}/databases/(default)/documents/listeler/${kod}`;
  const yanit = await fetch(`https://firestore.googleapis.com/v1/projects/${FIREBASE.projectId}/databases/(default)/documents:commit?key=${FIREBASE.apiKey}`, {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    keepalive: true,   // sayfa arka plana geçse de istek tamamlansın
    body: JSON.stringify({ writes: [{
      transform: { document: belge, fieldTransforms: [{ fieldPath: alanYolu, increment: { integerValue: "1" } }] },
      currentDocument: { exists: true }
    }] })
  });
  if (!yanit.ok) throw new Error("Sayaç hatası: HTTP " + yanit.status);
}

// Müşteri linki açtı -> "o" +1
const listeAcildi = kod => sayacArtir(kod, "o");

// Müşteri bir ürünün "Satın Al" butonuna bastı -> "c.<ürünId>" +1
const urunTiklandi = (kod, urunId) => sayacArtir(kod, "c.`" + String(urunId).replace(/[`\\]/g, "") + "`");
</script>
<script>
const KAYIT_ANAHTAR = 'takviyeSecim_v1';
const ZAMANLAR = ['Aç', 'Tok', 'Sabah', 'Akşam'];
// Giriş yapan kullanıcı (aşağıdaki module script doldurur): { kullanici, ad }
window.oturum = null;
let urunler = [];
let secim = new Map();        // id -> { adet, not }  (ekleme sırası korunur)
let aktifKategori = 'Tümü';

const $ = id => document.getElementById(id);

function esc(s) {
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

// Türkçe karakter duyarsız arama
function norm(s) {
  return String(s).toLocaleLowerCase('tr')
    .replace(/ı/g,'i').replace(/ğ/g,'g').replace(/ü/g,'u')
    .replace(/ş/g,'s').replace(/ö/g,'o').replace(/ç/g,'c').replace(/i̇/g,'i');
}

// linklendi=true: bu seçimin linki oluşturuldu -> sayfa bir dahaki açılışta boş başlar.
// Link oluşturulmadan sayfa kapanırsa (yanlışlıkla) seçimler geri gelir.
function kaydet(linklendi = false) {
  try {
    localStorage.setItem(KAYIT_ANAHTAR, JSON.stringify({
      secim: [...secim.entries()],
      kisi: $('kisi').value,
      linklendi: linklendi === true
    }));
  } catch (e) {}
}

function yeniListe() {
  secim.clear();
  $('kisi').value = '';
  $('ara').value = '';
  aktifKategori = 'Tümü';
  sonImza = '';
  sonKod = '';
  try { localStorage.removeItem(KAYIT_ANAHTAR); } catch (e) {}
  kategorileriCiz();
  listeyiCiz();
  window.scrollTo(0, 0);
}

function yukleKayit() {
  try {
    const k = JSON.parse(localStorage.getItem(KAYIT_ANAHTAR) || 'null');
    if (!k) return;
    if (k.linklendi) { localStorage.removeItem(KAYIT_ANAHTAR); return; }
    const gecerli = new Set(urunler.map(u => u.id));
    secim = new Map((k.secim || []).filter(([id]) => gecerli.has(id)).map(([id, s]) => [id, {
      adet: s.adet || 1,
      gunde: s.gunde || 1,
      zaman: Array.isArray(s.zaman) ? s.zaman : [],
      not: s.not || ''
    }]));
    $('kisi').value = k.kisi || '';
  } catch (e) {}
}

function bildir(metin) {
  const b = $('bildirim');
  b.textContent = metin;
  b.style.display = 'block';
  clearTimeout(bildir.t);
  bildir.t = setTimeout(() => b.style.display = 'none', 1800);
}

function kategorileriCiz() {
  const katlar = ['Tümü', 'Seçilenler', ...new Set(urunler.map(u => u.kategori).filter(Boolean))];
  $('kategoriler').innerHTML = katlar.map(k =>
    `<button class="kat ${k === aktifKategori ? 'aktif' : ''}" data-kat="${esc(k)}">${esc(k)}</button>`
  ).join('');
}

function listeyiCiz() {
  const q = norm($('ara').value.trim());
  const gorunen = urunler.filter(u => {
    if (aktifKategori === 'Seçilenler' && !secim.has(u.id)) return false;
    if (aktifKategori !== 'Tümü' && aktifKategori !== 'Seçilenler' && u.kategori !== aktifKategori) return false;
    if (q && !norm(u.ad + ' ' + (u.kategori || '')).includes(q)) return false;
    return true;
  });

  if (!gorunen.length) {
    $('liste').innerHTML = '<div class="bos">Eşleşen ürün yok.</div>';
  } else {
    $('liste').innerHTML = gorunen.map(u => {
      const s = secim.get(u.id);
      return `
      <div class="urun ${s ? 'secili' : ''}" data-id="${esc(u.id)}">
        <div class="satir" data-islem="sec">
          <img src="${esc(u.gorsel)}" alt="" loading="lazy">
          <div class="ad">${esc(u.ad)}<small>${esc(u.kategori || '')}</small></div>
          <div class="tik">${s ? '✓' : ''}</div>
        </div>
        <div class="detay">
          <div class="adetSat"><span class="etiket">Adet:</span>
            <button data-islem="eksi" data-alan="adet">−</button>
            <span data-deger="adet">${s ? s.adet : 1}</span>
            <button data-islem="arti" data-alan="adet">+</button>
          </div>
          <div class="adetSat"><span class="etiket">Günde:</span>
            <button data-islem="eksi" data-alan="gunde">−</button>
            <span data-deger="gunde">${s ? s.gunde : 1}</span>
            <button data-islem="arti" data-alan="gunde">+</button>
          </div>
          <div class="zamanlar">${ZAMANLAR.map(z =>
            `<button class="zaman ${s && s.zaman.includes(z) ? 'aktif' : ''}" data-islem="zaman" data-zaman="${z}">${z}</button>`
          ).join('')}</div>
          <textarea data-islem="not" placeholder="Açıklama (isteğe bağlı)">${s ? esc(s.not) : ''}</textarea>
        </div>
      </div>`;
    }).join('');
  }
  sayiyiGuncelle();
}

function sayiyiGuncelle() {
  const n = secim.size;
  $('sayi').textContent = n + ' ürün seçildi';
  $('olustur').disabled = n === 0;
}

// Aynı seçim için tekrar basılırsa yeni kayıt açılmaz, önceki kod kullanılır
let sonImza = '';
let sonKod = '';

async function linkOlustur() {
  const liste = [...secim.entries()].map(([id, s]) => ({
    id, adet: s.adet, gunde: s.gunde,
    zaman: ZAMANLAR.filter(z => s.zaman.includes(z)),   // sabit sırada kaydet
    not: (s.not || '').trim()
  }));
  const kisi = $('kisi').value.trim();
  if (!window.oturum) throw new Error("Oturum yok. Lütfen giriş yapın.");
  const hazirlayan = window.oturum.ad;
  const imza = JSON.stringify([liste, kisi, hazirlayan]);
  if (imza !== sonImza || !sonKod) {
    const token = await window.oturum.kullanici.getIdToken();
    sonKod = await listeKaydet(liste, kisi, hazirlayan, token);
    sonImza = imza;
  }
  kaydet(true);
  const taban = location.origin + location.pathname.replace(/secim\.html$/, '');
  return taban + '?l=' + sonKod;
}

// --- Olaylar ---
$('liste').addEventListener('click', e => {
  const kart = e.target.closest('.urun');
  if (!kart) return;
  const id = kart.dataset.id;
  const islem = e.target.closest('[data-islem]')?.dataset.islem;

  if (islem === 'sec') {
    if (secim.has(id)) secim.delete(id); else secim.set(id, { adet: 1, gunde: 1, zaman: [], not: '' });
    kaydet();
    listeyiCiz();
    if (secim.has(id)) {
      const ta = document.querySelector(`.urun[data-id="${CSS.escape(id)}"] textarea`);
      if (ta) ta.focus({ preventScroll: true });
    }
  } else if (islem === 'arti' || islem === 'eksi') {
    const s = secim.get(id);
    if (!s) return;
    const alan = e.target.dataset.alan;            // 'adet' veya 'gunde'
    s[alan] = Math.min(99, Math.max(1, s[alan] + (islem === 'arti' ? 1 : -1)));
    kart.querySelector(`[data-deger="${alan}"]`).textContent = s[alan];
    kaydet();
  } else if (islem === 'zaman') {
    const s = secim.get(id);
    if (!s) return;
    const z = e.target.dataset.zaman;
    if (s.zaman.includes(z)) {
      s.zaman = s.zaman.filter(x => x !== z);
    } else {
      // Aç ve Tok birlikte seçilemez
      const zit = { 'Aç': 'Tok', 'Tok': 'Aç' }[z];
      s.zaman = s.zaman.filter(x => x !== zit).concat(z);
    }
    kart.querySelectorAll('.zaman').forEach(b => b.classList.toggle('aktif', s.zaman.includes(b.dataset.zaman)));
    kaydet();
  }
});

$('liste').addEventListener('input', e => {
  if (e.target.dataset.islem !== 'not') return;
  const id = e.target.closest('.urun').dataset.id;
  const s = secim.get(id);
  if (s) { s.not = e.target.value; kaydet(); }
});

$('kategoriler').addEventListener('click', e => {
  const b = e.target.closest('.kat');
  if (!b) return;
  aktifKategori = b.dataset.kat;
  kategorileriCiz();
  listeyiCiz();
});

$('ara').addEventListener('input', listeyiCiz);
$('kisi').addEventListener('input', () => { $('kisi').classList.remove('uyari'); kaydet(); });


$('temizle').addEventListener('click', () => {
  if (!secim.size && !$('kisi').value) return;
  if (!confirm('Tüm seçimler ve kişi adı silinsin mi?')) return;
  yeniListe();
});

// Ad Soyad: sipariş eşleştirmesi için en az iki kelime (ad + soyad)
function adSoyadGecerli(metin) {
  const parcalar = metin.trim().split(/\s+/).filter(p => p.length >= 2);
  return parcalar.length >= 2;
}

$('olustur').addEventListener('click', async () => {
  if (!adSoyadGecerli($('kisi').value)) {
    $('kisi').classList.add('uyari');
    $('kisi').focus();
    window.scrollTo(0, 0);
    bildir('Müşterinin adını ve soyadını yazın');
    return;
  }
  const btn = $('olustur');
  btn.disabled = true;
  btn.textContent = 'Oluşturuluyor...';
  try {
    $('linkKutu').value = await linkOlustur();
    $('perde').classList.add('acik');
  } catch (e) {
    alert('Link oluşturulamadı. İnternet bağlantısını kontrol edip tekrar deneyin.\n\n' + e.message);

    sayiyiGuncelle();
  }
});

$('perde').addEventListener('click', e => { if (e.target.id === 'perde') $('perde').classList.remove('acik'); });

$('kopyala').addEventListener('click', async () => {
  const link = $('linkKutu').value;
  try {
    await navigator.clipboard.writeText(link);
  } catch (e) {
    $('linkKutu').select();
    document.execCommand('copy');
  }
  bildir('Link kopyalandı');
});

  const kisi = $('kisi').value.trim();

    'sizin için seçtiğimiz takviyeler:\n' + $('linkKutu').value;

});

$('paylas').addEventListener('click', async () => {
  if (navigator.share) {
    try { await navigator.share({ title: 'Takviye Listesi', url: $('linkKutu').value }); } catch (e) {}
  } else {
    bildir('Bu cihaz paylaşımı desteklemiyor, Kopyala kullanın');
  }
});

};

const app = initializeApp({

  authDomain: "takviyelistem.firebaseapp.com",
  projectId: "takviyelistem",

});
const auth = getAuth(app);
const el = id => document.getElementById(id);

try { el('girisEposta').value = localStorage.getItem('takviyeSonEposta') || ''; } catch (e) {}

el('girisForm').addEventListener('submit', async e => {
  e.preventDefault();
  el('girisHata').textContent = '';
  el('girisBtn').disabled = true;
  const eposta = el('girisEposta').value.trim();
  try {
    await signInWithEmailAndPassword(auth, eposta, el('girisSifre').value);

    el('girisSifre').value = '';

    const k = err.code || '';
    el('girisHata').textContent =

        ? 'E-posta veya şifre hatalı.'
        : k.includes('too-many-requests') ? 'Çok fazla deneme. Biraz bekleyip tekrar deneyin.'
        : k.includes('network') ? 'İnternet bağlantısı yok.'
        : 'Giriş yapılamadı: ' + k;
  } finally {
    el('girisBtn').disabled = false;
  }
});

el('cikisBtn').addEventListener('click', () => {
  if (confirm('Çıkış yapılsın mı?')) signOut(auth);
});

onAuthStateChanged(auth, async kullanici => {
  if (kullanici && !KULLANICILAR[kullanici.uid]) {
    el('girisHata').textContent = 'Bu hesabın liste hazırlama yetkisi yok.';
    await signOut(auth);
    return;
  }
  window.oturum = kullanici ? { kullanici, ad: KULLANICILAR[kullanici.uid] } : null;
  el('girisPerde').hidden = !!kullanici;
  el('cikisBtn').hidden = !kullanici;
  el('kullaniciAdi').textContent = kullanici ? KULLANICILAR[kullanici.uid] : '';
});
